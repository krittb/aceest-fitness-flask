name: ACEest Fitness CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile check (syntax errors)
        run: python -m compileall -q app.py test_app.py

      - name: Lint with flake8
        run: flake8 .

  docker-build:
    name: Docker Image Assembly
    runs-on: ubuntu-latest
    needs: build-lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          load: true
          tags: aceest-fitness:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Smoke test runtime image
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 2
          done
          docker logs aceest
          exit 1

  test:
    name: Automated Testing (in Docker)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: test
          load: true
          tags: aceest-fitness:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Run Pytest inside container
        run: docker run --rm aceest-fitness:test
