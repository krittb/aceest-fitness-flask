<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACEest Fitness &amp; Performance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-dark text-light">
  <header class="py-4 mb-4" style="background:#d4af37;">
    <div class="container">
      <h1 class="text-dark mb-0">ACEest FUNCTIONAL FITNESS</h1>
    </div>
  </header>

  <main class="container pb-5">
    <div class="row g-4">
      <!-- Add Member -->
      <div class="col-lg-5">
        <div class="card bg-secondary-subtle text-dark shadow">
          <div class="card-body">
            <h2 class="h5 card-title">Register Member</h2>
            <form id="member-form">
              <div class="mb-2">
                <label class="form-label">Name</label>
                <input class="form-control" name="name" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Age</label>
                <input class="form-control" name="age" type="number" min="1" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Weight (kg)</label>
                <input class="form-control" name="weight" type="number" step="0.1" min="1" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Height (cm) - optional, enables BMI</label>
                <input class="form-control" name="height" type="number" step="0.1" min="1">
              </div>
              <div class="mb-2">
                <label class="form-label">Program</label>
                <select class="form-select" name="program" required>
                  {% for p in programs %}
                  <option value="{{ p }}">{{ p }}</option>
                  {% endfor %}
                </select>
              </div>
              <button type="submit" class="btn btn-warning w-100 mt-2">Save Member</button>
            </form>
            <div id="form-message" class="mt-3"></div>
          </div>
        </div>
      </div>

      <!-- Member List -->
      <div class="col-lg-7">
        <div class="card bg-black text-light shadow">
          <div class="card-body">
            <h2 class="h5 card-title" style="color:#d4af37;">Members</h2>
            <table class="table table-dark table-striped">
              <thead>
                <tr>
                  <th>Name</th><th>Program</th><th>Calories</th><th>BMI</th><th></th>
                </tr>
              </thead>
              <tbody id="members-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function loadMembers() {
      const res = await fetch('/api/members');
      const data = await res.json();
      const body = document.getElementById('members-body');
      body.innerHTML = '';
      data.forEach(m => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${m.name}</td><td>${m.program}</td><td>${m.calories} kcal</td>` +
          `<td>${m.bmi ?? '-'}</td>` +
          `<td><button class="btn btn-sm btn-danger" onclick="deleteMember('${m.name}')">Delete</button></td>`;
        body.appendChild(row);
      });
    }

    async function deleteMember(name) {
      await fetch(`/api/members/${encodeURIComponent(name)}`, { method: 'DELETE' });
      loadMembers();
    }

    document.getElementById('member-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const payload = Object.fromEntries(form.entries());
      const res = await fetch('/api/members', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const msgBox = document.getElementById('form-message');
      const result = await res.json();
      if (res.ok) {
        msgBox.innerHTML = `<div class="alert alert-success py-1">Saved ${result.name}</div>`;
        e.target.reset();
        loadMembers();
      } else {
        msgBox.innerHTML = `<div class="alert alert-danger py-1">${result.error}</div>`;
      }
    });

    loadMembers();
  </script>
</body>
</html>
